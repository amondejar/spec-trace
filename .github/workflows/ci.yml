name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore SpecTrace.sln

      - name: Build
        run: dotnet build SpecTrace.sln -c Release --no-restore

      - name: Tests
        run: dotnet test tests/SpecTrace.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Pack
        run: |
          dotnet pack src/SpecTrace.Abstractions -c Release --no-build -o artifacts
          dotnet pack src/SpecTrace.Package -c Release -o artifacts
          dotnet pack src/SpecTrace.Tool -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  # The Action itself, run against the sample with the freshly packed tool.
  sample-report:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Sample report
        id: spectrace
        uses: ./
        with:
          root: samples/Orders
          tool-source: ${{ github.workspace }}/artifacts
          # The sample has intentional gaps (ORD-003 and ORD-002 AC-2): they must not break CI.
          fail-on-gaps: "false"

      - name: Check the sample still has its 2 gaps and its unreviewed change
        run: |
          test "${{ steps.spectrace.outputs.gaps }}" = "2"
          test "${{ steps.spectrace.outputs.drift }}" = "1"
