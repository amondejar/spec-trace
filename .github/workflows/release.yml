name: Release

# Publishes SpecTrace, SpecTrace.Abstractions and SpecTrace.Tool to nuget.org with Trusted Publishing (OIDC):
# no API key is stored; NuGet/login exchanges the GitHub token for a temporary key (valid for 1 hour).
#
# Runs when a v* tag is pushed (git tag -a v0.5 -m "..." && git push origin v0.5), or manually from
# Actions → Release → Run workflow, choosing the tag in "Use workflow from".
#
# nuget.org policy: Repository Owner = amondejar, Repository = spec-trace, Workflow File = release.yml.
# Requires the NUGET_USER secret with your nuget.org user name (profile name, not your email).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release with the .nupkg files
  id-token: write   # OIDC token for Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that this runs from a tag
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Run this workflow from a v* tag (in 'Use workflow from' choose the tag, not the branch)."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check that the tag matches the package version
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          tag="${GITHUB_REF_NAME#v}"
          echo "Package version: $version · tag: $GITHUB_REF_NAME"
          case "$version" in
            "$tag"|"$tag".*|"$tag"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Directory.Build.props."; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          dotnet restore SpecTrace.sln
          dotnet build SpecTrace.sln -c Release --no-restore
          dotnet test tests/SpecTrace.Tests -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/SpecTrace.Abstractions -c Release --no-build -o artifacts
          dotnet pack src/SpecTrace.Package -c Release -o artifacts
          dotnet pack src/SpecTrace.Tool -c Release --no-build -o artifacts
          ls -l artifacts

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: |
          # The attributes first: the SpecTrace package depends on them.
          for p in SpecTrace.Abstractions SpecTrace SpecTrace.Tool; do
            dotnet nuget push "artifacts/$p.${{ steps.version.outputs.version }}.nupkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: GitHub release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --verify-tag --prerelease \
              --title "SpecTrace $GITHUB_REF_NAME" --notes "Packages ${{ steps.version.outputs.version }}. See CHANGELOG.md for the changes."
          fi
