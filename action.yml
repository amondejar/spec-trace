name: SpecTrace report
description: >
  Publishes SpecTrace spec → code → test traceability on every pull request:
  file annotations, job summary and one comment with the full matrix,
  updated on every push.
author: SpecTrace contributors
branding:
  icon: check-square
  color: blue

inputs:
  root:
    description: Folder containing spectrace.json (relative to the repository root).
    default: "."
  fail-on-gaps:
    description: If 'true', the job fails when active requirements are not implemented, have no tests, or have criteria without tests.
    default: "false"
  fail-on-drift:
    description: If 'true', the job fails when a requirement's text changed after review (spectrace.lock) and its code or tests have not been reviewed.
    default: "false"
  test-results:
    description: >
      .trx files or folders with test results (dotnet test --logger trx), separated by spaces. The report then shows
      whether each acceptance criterion's tests pass, and failing criteria are annotated on the spec. Empty: not shown.
    default: ""
  mutation-report:
    description: >
      Stryker mutation-report.json (dotnet stryker --reporter json), or a folder: the newest report in it. The report then
      shows, per requirement, how many changes to its code the tests detect, and annotates the ones they do not.
    default: ""
  impact:
    description: If 'true' and the event is a pull request, the report starts with the requirements the pull request touches.
    default: "true"
  comment:
    description: If 'true' and the event is a pull request, posts or updates a comment with the report.
    default: "true"
  tool-version:
    description: SpecTrace.Tool version to install. Empty = latest published (including previews).
    default: ""
  tool-source:
    description: Extra NuGet source to install the tool from (for example a folder with a local .nupkg).
    default: ""
  dotnet-version:
    description: .NET SDK used to run the tool.
    default: "8.0.x"
  github-token:
    description: Token used to post the comment. Needs the pull-requests:write permission.
    default: ${{ github.token }}

outputs:
  gaps:
    description: Number of requirements with gaps (not implemented, no tests, or criteria without tests).
    value: ${{ steps.report.outputs.gaps }}
  drift:
    description: Number of requirements whose text changed after the last review and have code or tests to review.
    value: ${{ steps.report.outputs.drift }}
  failing:
    description: Number of acceptance criteria with a failing test (needs test-results).
    value: ${{ steps.report.outputs.failing }}

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Install SpecTrace.Tool
      shell: bash
      env:
        TOOL_VERSION: ${{ inputs.tool-version }}
        TOOL_SOURCE: ${{ inputs.tool-source }}
      run: |
        args=(tool install --global SpecTrace.Tool)
        if [ -n "$TOOL_VERSION" ]; then args+=(--version "$TOOL_VERSION"); else args+=(--prerelease); fi
        if [ -n "$TOOL_SOURCE" ]; then args+=(--add-source "$TOOL_SOURCE"); fi
        dotnet "${args[@]}"
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Generate report
      id: report
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        LINK_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha || github.sha }}/
        TEST_RESULTS: ${{ inputs.test-results }}
        MUTATION_REPORT: ${{ inputs.mutation-report }}
        IMPACT: ${{ inputs.impact }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        root="${ROOT%/}"
        if [ "$root" = "." ]; then prefix=""; else prefix="$root/"; fi

        results=()
        for path in $TEST_RESULTS; do results+=(--test-results "$path"); done
        if [ -n "$MUTATION_REPORT" ]; then results+=(--mutation "$MUTATION_REPORT"); fi

        # Pull requests: compare with the base branch to list the requirements they touch.
        impact=()
        if [ "$IMPACT" = "true" ] && [ -n "$BASE_REF" ]; then
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
          if git rev-parse --verify --quiet "origin/$BASE_REF" > /dev/null; then impact=(--base "origin/$BASE_REF"); fi
        fi

        # Annotations on the PR files.
        spectrace report --root "$root" --format github "${results[@]}"

        # Markdown report with absolute links, for the job summary and the comment.
        spectrace report --root "$root" --link-base "${LINK_BASE}${prefix}" --out "$RUNNER_TEMP/spectrace-report.md" "${results[@]}" "${impact[@]}" > /dev/null
        cat "$RUNNER_TEMP/spectrace-report.md" >> "$GITHUB_STEP_SUMMARY"

        json=$(spectrace report --root "$root" --format json "${results[@]}")
        failing=$(echo "$json" | jq '.testResults.failing // 0')
        echo "failing=$failing" >> "$GITHUB_OUTPUT"

        gaps=$(echo "$json" | jq '[.requirements[] | select(.gap)] | length')
        echo "gaps=$gaps" >> "$GITHUB_OUTPUT"
        echo "Requirements with gaps: $gaps"

        drift=$(echo "$json" | jq '[.requirements[] | select(.drift.pending)] | length')
        echo "drift=$drift" >> "$GITHUB_OUTPUT"
        echo "Requirements with unreviewed spec changes: $drift"

    - name: Comment on the PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        REPORT_PATH: ${{ runner.temp }}/spectrace-report.md
        ROOT: ${{ inputs.root }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = `<!-- spectrace-report:${process.env.ROOT} -->`;
          const body = `${marker}\n${fs.readFileSync(process.env.REPORT_PATH, 'utf8')}`;
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const existing = comments.find(c => c.body && c.body.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Fail on gaps
      if: inputs.fail-on-gaps == 'true' && steps.report.outputs.gaps != '0'
      shell: bash
      run: |
        echo "::error title=SpecTrace::${{ steps.report.outputs.gaps }} requirement(s) with traceability gaps. See the report."
        exit 1

    - name: Fail on unreviewed spec changes
      if: inputs.fail-on-drift == 'true' && steps.report.outputs.drift != '0'
      shell: bash
      run: |
        echo "::error title=SpecTrace::${{ steps.report.outputs.drift }} requirement(s) changed after review. Review their code and tests and run dotnet spectrace lock --requirement <ID>."
        exit 1
